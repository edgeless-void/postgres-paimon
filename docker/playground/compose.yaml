# paimon_heap playground: PostgreSQL 18 + paimon_heap, offloading to a local
# S3 store (SeaweedFS). See README.md.
name: paimon-playground

x-s3-credentials: &s3-credentials
  AWS_ACCESS_KEY_ID: playground
  AWS_SECRET_ACCESS_KEY: playground-secret
  AWS_REGION: us-east-1

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # Master, volume server, filer and S3 gateway in one process.
    command: >
      server -dir=/data -master.volumeSizeLimitMB=1024
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"

  postgres:
    build:
      context: postgres
      args:
        PAIMON_VERSION: ${PAIMON_VERSION:-}
        PAIMON_REPO: ${PAIMON_REPO:-VadimSurpin/postgres-paimon}
    environment:
      <<: *s3-credentials
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: paimon-warehouse
    depends_on:
      - seaweedfs
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "demo", "-d", "demo"]
      interval: 2s
      retries: 60

volumes:
  s3data:
  pgdata:
