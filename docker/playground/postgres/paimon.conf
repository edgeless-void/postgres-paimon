# Included from postgresql.conf. Settings for the playground.
listen_addresses = '*'
shared_preload_libraries = 'paimon_heap'

# Local Paimon tables; every flush is mirrored to S3 (keys: <table>/...).
paimon_heap.warehouse = '/var/lib/postgresql/paimon-warehouse'
paimon_heap.s3_region = 'us-east-1'

# Flush often so changes show up in S3 within seconds.
paimon_heap.flush_interval_txns = 1
paimon_heap.flush_interval_secs = 5
